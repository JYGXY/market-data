name: Tests

on:
  push:
  pull_request:

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate logic (market data)
        run: sh scripts/test_schedule_gate.sh
      - name: Gate logic (hot lists)
        run: sh scripts/test_hot_gate.sh
      - name: Every workflow cron is handled by its gate
        run: |
          python3 - <<'PY'
          import re, sys
          bad = False
          for wf_path, gate_path in [(".github/workflows/daily-market-data.yml", "scripts/schedule_gate.sh"),
                                     (".github/workflows/hot-lists.yml", "scripts/hot_gate.sh")]:
              crons = re.findall(r'cron:\s*"([^"]+)"', open(wf_path).read())
              cases = re.findall(r'^\s*"([^"]+)"\)\s*role=', open(gate_path).read(), re.M)
              print(wf_path, crons, "|", gate_path, cases)
              bad |= sorted(crons) != sorted(cases)
          if bad:
              sys.exit("workflow crons and gate cases differ")
          PY

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
