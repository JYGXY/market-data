name: Daily market data

# 目标：纽约时间周一至周五 16:20 各运行一次（美股收盘后 20 分钟）。
# GitHub 的 cron 只认 UTC，所以放两个定时：
#   20:20 UTC = 纽约 16:20（夏令时 EDT, UTC-4）
#   21:20 UTC = 纽约 16:20（冬令时 EST, UTC-5）
# 每次触发先看纽约当前处于哪个时区偏移，只有与该定时对应的那一个真正执行，
# 另一个直接跳过。判断依据是 UTC 偏移而不是“现在几点”，
# 所以即使 GitHub 定时延迟了几十分钟，也不会跑两次或漏跑。
# 纽约 16:20 在 UTC 仍是同一天，所以 cron 的周一至周五（1-5）与纽约一致；
# 门控里再按纽约日期核对一次星期几。手动触发（workflow_dispatch）不受限制。
on:
  schedule:
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: New York time gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          weekday=$(TZ=America/New_York date +%u)   # 1=周一 ... 7=周日
          echo "New York now: $(TZ=America/New_York date '+%F %T %Z') offset=$offset weekday=$weekday event=$EVENT schedule=$SCHEDULE"
          run=false
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$weekday" -gt 5 ]; then
            run=false
          elif [ "$SCHEDULE" = "20 20 * * 1-5" ] && [ "$offset" = "-0400" ]; then
            run=true
          elif [ "$SCHEDULE" = "20 21 * * 1-5" ] && [ "$offset" = "-0500" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch_market_data.py

      - name: Forbidden-word check and commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          python scripts/check_forbidden.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json"))["trading_date"])')"
          git push
