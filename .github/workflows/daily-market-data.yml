name: Daily market data

# 纽约时间周一至周五：16:17 主任务（美股收盘后 17 分钟），16:47 备用补跑（下游 17:10 读文件）。
# 分钟数避开整点和半点：GitHub 文档说明整点前后负载最高，定时会延迟甚至被丢弃。
# GitHub 的 cron 只认 UTC，所以每个任务各放两个定时（夏令时 EDT / 冬令时 EST）：
#   主任务 20:17 UTC (EDT) / 21:17 UTC (EST)
#   备用   20:47 UTC (EDT) / 21:47 UTC (EST)
# scripts/schedule_gate.sh 按纽约当前 UTC 偏移只放行对应的那个，并核对纽约星期几；
# 主任务和备用都遵守两条规则（scripts/schedule_gate.sh）：
#   - 当天已有完整数据（complete=true）就跳过，不覆盖；
#   - 纽约 18:00 以后不抓（期货、汇率、亚太指数已进入下一交易时段）。
# GitHub 定时常迟到数小时，迟到的运行会被这两条挡住；实际由外部定时触发 workflow_dispatch 作为主力。
# 手动触发：mode=full / backup 同样遵守以上规则；mode=force 不做检查并允许覆盖。
# 每次写入的文件带 run_id / run_attempt / run_trigger，下游引用时写上 run_id。
on:
  schedule:
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
    - cron: "47 20 * * 1-5"
    - cron: "47 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full / backup = 当天已有完整数据或已过纽约 18:00 则跳过；force = 不检查、允许覆盖"
        type: choice
        options: [full, backup, force]
        default: full

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 取分支最新提交（而非触发时的提交），备用任务才能看到主任务刚推送的数据
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Schedule gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "New York now: $(TZ=America/New_York date '+%F %T %Z') event=$EVENT schedule=$SCHEDULE mode=$MODE"
          sh scripts/schedule_gate.sh "$EVENT" "$SCHEDULE" "${MODE:-full}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_TRIGGER: ${{ github.event_name }}:${{ steps.gate.outputs.role }}
        run: python scripts/fetch_market_data.py ${{ steps.gate.outputs.fetch_args }}

      - name: Forbidden-word check and commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          python scripts/check_forbidden.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: $(python -c 'import json;d=json.load(open("data/latest.json"));print(d["trading_date"], "run", d["run_id"], d["run_trigger"])')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
