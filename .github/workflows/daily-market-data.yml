name: Daily market data

# 纽约时间周一至周五：16:17 主任务（美股收盘后 17 分钟），17:13 备用补跑。
# 分钟数避开整点和半点：GitHub 文档说明整点前后负载最高，定时会延迟甚至被丢弃。
# GitHub 的 cron 只认 UTC，所以每个任务各放两个定时（夏令时 EDT / 冬令时 EST）：
#   主任务 20:17 UTC (EDT) / 21:17 UTC (EST)
#   备用   21:13 UTC (EDT) / 22:13 UTC (EST)
# scripts/schedule_gate.sh 按纽约当前 UTC 偏移只放行对应的那个，并核对纽约星期几；
# 备用任务在当天数据已生成时直接退出，只在主任务漏跑时补跑。
# 手动触发：mode=full 直接抓取；mode=backup 走备用逻辑（用于验证）。
on:
  schedule:
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
    - cron: "13 21 * * 1-5"
    - cron: "13 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 直接抓取；backup = 当天数据已存在则跳过"
        type: choice
        options: [full, backup]
        default: full

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 取分支最新提交（而非触发时的提交），备用任务才能看到主任务刚推送的数据
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Schedule gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "New York now: $(TZ=America/New_York date '+%F %T %Z') event=$EVENT schedule=$SCHEDULE mode=$MODE"
          sh scripts/schedule_gate.sh "$EVENT" "$SCHEDULE" "${MODE:-full}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch_market_data.py

      - name: Forbidden-word check and commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          python scripts/check_forbidden.py
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json"))["trading_date"])')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
